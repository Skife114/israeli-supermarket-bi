name: Scrape And Parse Sample

"on":
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'scrape_and_parse_sample.py'
      - 'transform_real_data.py'
      - 'requirements.txt'
      - '.github/workflows/scrape-and-parse-sample.yml'
  schedule:
    # רץ כל יום ב-03:00 UTC (06:00 בישראל בקיץ / 05:00 בחורף) -
    # שעה שקטה, אחרי שרוב הרשתות כבר עדכנו את קבצי המחירים היומיים שלהן
    - cron: '0 3 * * *'

jobs:
  scrape-and-parse:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scrape and parse sample
        run: python scrape_and_parse_sample.py

      - name: Run transform to dashboard schema
        run: python transform_real_data.py

      - name: Commit refreshed fallback/cache/dashboard data (if changed)
        # transform_real_data.py מרענן על הדיסק כמה קבצים שצריכים להישמר
        # בפועל בריפו (git) ולא רק על הדיסק הזמני של ה-runner:
        # - data/city_code_fallback.json (בכל הצלחה של data.gov.il)
        # - data/geocode_cache.json (מצטבר עם כל geocoding מוצלח מול Nominatim)
        # - site/data/*.json (chains/stores/products/current_avg לדשבורד הסטטי -
        #   Netlify עושה auto-deploy מ-git, אז ה-commit הזה הוא גם מה שמרענן
        #   את האתר החי בכל ריצה יומית מוצלחת)
        # משתמשים ב-git add לפני הבדיקה כדי שזה יעבוד גם בפעם הראשונה שקובץ
        # נוצר (קובץ חדש שעדיין לא במעקב git, לא רק שינוי בקובץ קיים).
        if: github.ref == 'refs/heads/main'
        run: |
          git add data/city_code_fallback.json data/geocode_cache.json site/data/*.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: refresh fallback/cache/dashboard data [skip ci]"
            # מישהו יכול לדחוף ל-main בזמן שהריצה הזו (שאורכת כ-20 דקות) עדיין
            # רצה - אז main המרוחק עלול להתקדם לפני שמגיעים לכאן. כל הקבצים
            # שאנחנו מקומטים כאן (caches + site/data/*.json) הם תוצר-הרצה מלא
            # מאפס בכל ריצה - לא עריכה ידנית - אז אם ריצה מקבילה אחרת שינתה
            # את *אותם* קבצים באותו זמן, אין טעם למזג שורה-שורה בין שני
            # "צילומי מצב" תקפים; גרסת הריצה הזו (שהיא גם העדכנית ביותר) פשוט
            # אמורה לנצח על פני קונפליקט. משתמשים ב-merge -X ours (לא rebase)
            # בדיוק בשביל זה: קונפליקט בקובץ שנוגע לנו נפתר תמיד לטובת מה
            # שיצרנו הרגע; קבצים אחרים שהשתנו ב-origin וללא קונפליקט עדיין
            # ממוזגים כרגיל. נסיון חוזר קצר (עד 3 פעמים) מכסה גם את המקרה הנדיר
            # שדחיפה מקבילה נוספת מגיעה בדיוק בין ה-fetch ל-push שלנו.
            for attempt in 1 2 3; do
              git fetch origin main
              git merge -X ours --no-edit origin/main
              if git push; then
                echo "עודכן ונדחף data/ עם נתונים טריים (ניסיון $attempt)."
                break
              fi
              echo "push נדחה (ניסיון $attempt) - מנסים שוב..."
              sleep 5
            done
          else
            echo "אין שינוי בקבצים - לא נדרש commit."
          fi

      - name: Upload parsed CSV files (for inspection)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parsed-csv-sample
          path: parsed_csv/
          if-no-files-found: warn

      - name: Upload transformed JSON files (for inspection)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transformed-json-sample
          path: |
            *_transformed.json
          if-no-files-found: warn
