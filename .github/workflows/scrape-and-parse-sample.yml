name: Scrape And Parse Sample

"on":
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'scrape_and_parse_sample.py'
      - 'transform_real_data.py'
      - 'requirements.txt'
      - '.github/workflows/scrape-and-parse-sample.yml'
  schedule:
    # רץ כל יום ב-03:00 UTC (06:00 בישראל בקיץ / 05:00 בחורף) -
    # שעה שקטה, אחרי שרוב הרשתות כבר עדכנו את קבצי המחירים היומיים שלהן
    - cron: '0 3 * * *'

jobs:
  scrape-and-parse:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scrape and parse sample
        run: python scrape_and_parse_sample.py

      - name: Run transform to dashboard schema
        run: python transform_real_data.py

      - name: Commit refreshed fallback and cache data (if changed)
        # transform_real_data.py מרענן על הדיסק שני קבצי גיבוי/מטמון:
        # data/city_code_fallback.json (בכל הצלחה של data.gov.il) ו-
        # data/geocode_cache.json (מצטבר עם כל geocoding מוצלח מול Nominatim).
        # השלב הזה מוודא שהריענון נשמר בפועל בריפו (git) ולא רק על הדיסק
        # הזמני של ה-runner - אחרת הקבצים היו נשארים קפואים לנצח. משתמשים
        # ב-git add לפני הבדיקה כדי שזה יעבוד גם בפעם הראשונה שקובץ המטמון
        # נוצר (קובץ חדש שעדיין לא במעקב git, לא רק שינוי בקובץ קיים).
        if: github.ref == 'refs/heads/main'
        run: |
          git add data/city_code_fallback.json data/geocode_cache.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "chore: refresh city code fallback and geocode cache [skip ci]"
            git push
            echo "עודכן ונדחף data/ עם נתונים טריים."
          else
            echo "אין שינוי בקבצי data/ - לא נדרש commit."
          fi

      - name: Upload parsed CSV files (for inspection)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parsed-csv-sample
          path: parsed_csv/
          if-no-files-found: warn

      - name: Upload transformed JSON files (for inspection)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transformed-json-sample
          path: |
            *_transformed.json
          if-no-files-found: warn
