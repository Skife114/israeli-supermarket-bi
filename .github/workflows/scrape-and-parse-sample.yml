name: Scrape And Parse Sample

"on":
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'scrape_and_parse_sample.py'
      - 'transform_real_data.py'
      - 'requirements.txt'
      - '.github/workflows/scrape-and-parse-sample.yml'
  schedule:
    # רץ כל יום ב-03:00 UTC (06:00 בישראל בקיץ / 05:00 בחורף) -
    # שעה שקטה, אחרי שרוב הרשתות כבר עדכנו את קבצי המחירים היומיים שלהן
    - cron: '0 3 * * *'

jobs:
  scrape-and-parse:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scrape and parse sample
        run: python scrape_and_parse_sample.py

      - name: Run transform to dashboard schema
        run: python transform_real_data.py

      - name: Commit refreshed city code fallback (if changed)
        # transform_real_data.py מרענן את data/city_code_fallback.json בדיסק
        # כל פעם שה-API החי של data.gov.il מצליח. השלב הזה מוודא שהריענון
        # הזה גם נשמר בפועל בריפו (git), ולא רק על הדיסק הזמני של ה-runner -
        # אחרת קובץ הגיבוי הסטטי היה נשאר קפוא לנצח בגרסה שנשמרה בפעם הראשונה.
        if: github.ref == 'refs/heads/main'
        run: |
          if ! git diff --quiet -- data/city_code_fallback.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add data/city_code_fallback.json
            git commit -m "chore: refresh city code fallback data [skip ci]"
            git push
            echo "עודכן ונדחף data/city_code_fallback.json עם נתונים טריים."
          else
            echo "אין שינוי ב-data/city_code_fallback.json - לא נדרש commit."
          fi

      - name: Upload parsed CSV files (for inspection)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parsed-csv-sample
          path: parsed_csv/
          if-no-files-found: warn

      - name: Upload transformed JSON files (for inspection)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: transformed-json-sample
          path: |
            *_transformed.json
          if-no-files-found: warn
